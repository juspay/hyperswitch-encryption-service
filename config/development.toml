[management_server]
host = "127.0.0.1"
port = 6128

[metrics]
mode = "prometheus"

[pool_config]
pool = 2

[server]
host = "127.0.0.1"
port = 5000
set_tcp_nodelay = true

[database]
user = "db_user"
password = "db_pass"
host = "localhost"
port = 5432
dbname = "encryption_db"
pool_size = 5
min_idle = 2
enable_ssl = false
max_lifetime_secs = 1800
idle_timeout_secs = 600
connection_acquire_timeout_secs = 30
connect_timeout_secs = 5

[multitenancy.tenants.public]
schema = "public"

[multitenancy.tenants.global]
schema = "global"

[log]
enabled = true
log_level = "debug"
log_format = "console"

